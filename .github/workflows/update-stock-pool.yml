name: Update Stock Pool

on:
  # GitHub cron uses UTC. 00:30 UTC = 08:30 Asia/Shanghai.
  schedule:
    - cron: '30 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stock-pool:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run tests
        run: |
          python test_daima_scraper.py
          python test_stock_pool_publisher.py
          python -m py_compile daima.py stock_pool_publisher.py

      - name: Update stock_pool.json
        run: python stock_pool_publisher.py --date "$(TZ=Asia/Shanghai date +%F)" --file stock_pool.json

      - name: Commit stock pool update
        run: |
          if git diff --quiet -- stock_pool.json; then
            echo "stock_pool.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_pool.json
          git commit -m "Update stock pool for $(TZ=Asia/Shanghai date +%F)"
          git push
